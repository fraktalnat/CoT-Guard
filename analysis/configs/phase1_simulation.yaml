# Phase 1: fake-data check of the report CI (analysis/phase1_simulation.py).
# The params are guesses until the pilot: replace side_pass_rate, sub_mean and problem_sd with pilot estimates.
seed: 20261021
n_sims: 2000         # CHANGED (was 1000): coverage standard error drops from ~0.7 to ~0.5 points
n_resamples: 1000    # bootstrap resamples per experiment (the real report uses 10,000)
level: 0.95
ci_methods: [percentile, bca]   # percentile is pre-registered; BCa replaces it if percentile coverage < 92%
truth_draws: 200000  # Monte Carlo draws for the true ΔTPR

params:
  rollouts: 5
  k: 4
  side_pass_rate: {additive: 1.0, substitutive: 1.0}   # CHANGED: pilot gate 1, 30/30 each
  sub_mean: 0.84      # CHANGED: pilot "sub_mean"
  problem_sd: 0.15    # CHANGED: pilot "problem_sd"
  true_delta: 0.2     # the effect we plant
  delta_sd: 0.1       # how much the effect itself differs between problems
  sample_sd: 0.15     # how much generations of one problem differ

# Each scenario overrides params.
scenarios:
  pilot:   {n_problems: 10, rollouts: 3}
  full:    {n_problems: 27}   # CHANGED (was 32): http-only problems dropped, Deviations 2026-10-23
  full_lopsided: {n_problems: 27, side_pass_rate: {additive: 0.8, substitutive: 0.3}}
  no_effect: {n_problems: 27, true_delta: 0.0}
