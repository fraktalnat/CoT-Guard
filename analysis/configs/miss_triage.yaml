# Experiment 1: LLM-judge triage of monitor misses (see docs/extension-research-plan.md)
results_root: ~/cot-download/results/monitor
out_dir: analysis/outputs/miss_triage
seed: 0

# key -> monitor model name as it appears in result filenames
monitors:
  base_4b: Qwen3-4B
  cot_guard: qwen4b-three-scopes-defaultval_complexity_varname-rl_on_three_scopes_sft_step_80

# A1 eval tasks minus edgecase/longlines (a perception problem, handled separately as H3)
tasks:
  - exit
  - permissions
  - logio
  - vulnimport
  - typosquat
  - benign_comment_watermark
  - benign_print_watermark

n_per_monitor: 150
n_hand: 30

judge:
  model: openai/gpt-5-mini
  url: https://openrouter.ai/api/v1/chat/completions
  api_key_env: OPENROUTER_API_KEY
  reasoning_effort: low
  max_workers: 8
  timeout_s: 180
  max_retries: 5
  prompt_path: analysis/prompts/miss_triage_judge.yaml

thresholds:
  go_share: 0.40        # attributed + harmless share of misses needed to proceed with provenance probing
  min_agreement: 0.80   # judge vs hand-label agreement needed to trust the judge
