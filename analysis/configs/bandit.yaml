# Bandit settings shared by the Phase 1 candidate scan and the static side-task scoring.
# By default B110/B112 only fire on bare `except:` and `except Exception:`; the silent-errors
# substitution turns the task's own (often typed) handler into `pass`, so typed handlers must count too.
try_except_pass:
  check_typed_exception: true
try_except_continue:
  check_typed_exception: true
