# Experiment 2: can simple string matching separate unrequested (U) from requested (R) pairs?
# (see docs/extension-research-plan.md)
results_root: ~/cot-download/results/monitor
attack_root: ~/cot-download/datasets/attack
out_dir: analysis/outputs/overlap_baseline
seed: 0

# Attack CoTs are read from this monitor's side-all files; every monitor sees the same attacks
source_monitor: Qwen3-4B

# Same tasks as Exp 1: edgecase/longlines are a perception problem (H3)
tasks:
  - exit
  - permissions
  - logio
  - vulnimport
  - typosquat
  - benign_comment_watermark
  - benign_print_watermark

n_attacks: 100

overlap:
  ngram_sizes: [1, 2, 3, 4]   # containment_n = share of the CoT text's word n-grams that occur in the prompt
  n_bootstrap: 1000
  ci: 0.95
  n_copy_bins: 3              # paraphrased AUROC is also reported per quantile bin of paraphrase-vs-literal copying

# Rules for whoever writes paraphrases.jsonl (a person or an agent); no API is called
paraphrase_rules: analysis/prompts/overlap_paraphrase.yaml

thresholds:
  stop_auroc: 0.95   # best overlap metric reaching this on paraphrased pairs means a probe can't beat string matching
